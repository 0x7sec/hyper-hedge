name: Deploy Bybit Hedge Bot to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY || 'zu7QF2MXivrNUpxe2y' }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET || 'mzYaF9c7tFLrLThjKsFLueoFeFyFs5c8RcYo' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing VPS_HOST or VPS_SSH_KEY secret in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # Setup SSH key and directory
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "Connecting to $VPS_USER@$VPS_HOST on port $VPS_PORT..."

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "BYBIT_KEY='$BYBIT_API_KEY' BYBIT_SECRET='$BYBIT_API_SECRET' bash -s" << 'EOF'
            set -euo pipefail

            echo "=== [1/6] Preparing VPS Environment ==="
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3 python3-venv python3-pip git chrony curl

            # Enable Chrony for sub-millisecond Bybit API time synchronization
            sudo systemctl enable --now chrony || true

            CURRENT_USER=$(whoami)
            CURRENT_GROUP=$(id -gn)
            APP_DIR="$HOME/hyper_hedge_research"

            echo "Target Directory: $APP_DIR (User: $CURRENT_USER:$CURRENT_GROUP)"

            echo "=== [2/6] Syncing Code Repository ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository from GitHub..."
              git clone https://github.com/0x7sec/hyper-hedge.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              echo "Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "=== [3/6] Setting Up Python Virtual Environment ==="
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            ./venv/bin/pip install --upgrade pip -q
            ./venv/bin/pip install -r requirements.txt -q

            echo "=== [4/6] Injecting Active Configuration & Credentials (.env) ==="
            cat << ENVCONF > .env
# ==============================================================================
# BYBIT V5 MULTI-PAIR HEDGE BOT CONFIGURATION (BTC, ETH, SOL)
# Auto-generated by GitHub Actions Deploy Workflow
# ==============================================================================
BYBIT_API_KEY=${BYBIT_KEY}
BYBIT_API_SECRET=${BYBIT_SECRET}
SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT
LEVERAGE=4
MAX_CONCURRENT_PAIRS=3
TESTNET=true
POLL_INTERVAL=5
COOLDOWN_SECS=0
MAX_CYCLES=0
DRY_RUN=false
LOG_CSV=bybit_trades.csv
ENVCONF
            chmod 600 .env

            echo "=== [5/6] Configuring & Starting systemd Daemon ==="
            sudo tee /etc/systemd/system/bybit-bot.service > /dev/null << SERVICE
[Unit]
Description=Bybit Multi-Pair Concurrent Dual-Leg Hedge Bot
After=network.target network-online.target time-sync.target
Wants=network-online.target time-sync.target

[Service]
Type=simple
User=$CURRENT_USER
Group=$CURRENT_GROUP
WorkingDirectory=$APP_DIR
EnvironmentFile=$APP_DIR/.env
ExecStart=$APP_DIR/venv/bin/python run_bybit_bot.py
Restart=always
RestartSec=10

# Resource governance & crash resilience
LimitNOFILE=65535
TimeoutStopSec=30
KillMode=process

# Logging: routed to systemd journal
StandardOutput=journal
StandardError=journal
SyslogIdentifier=bybit-bot

[Install]
WantedBy=multi-user.target
SERVICE

            # Configure Logrotate for trade audit CSV
            sudo tee /etc/logrotate.d/bybit-bot > /dev/null << LOGROT
$APP_DIR/bybit_trades.csv {
    weekly
    missingok
    rotate 12
    compress
    delaycompress
    notifempty
    copytruncate
}
LOGROT
            sudo chmod 644 /etc/logrotate.d/bybit-bot

            # Reload and restart daemon
            sudo systemctl daemon-reload
            sudo systemctl enable bybit-bot
            sudo systemctl restart bybit-bot

            echo "=== [6/6] Verifying Daemon Status ==="
            sleep 3
            if sudo systemctl is-active --quiet bybit-bot; then
              echo ">>> SUCCESS: bybit-bot is ACTIVE and running on VPS! <<<"
              sudo systemctl status bybit-bot --no-pager
            else
              echo "::error::bybit-bot failed to start. Recent journal logs:"
              sudo journalctl -u bybit-bot -n 50 --no-pager
              exit 1
            fi
          EOF

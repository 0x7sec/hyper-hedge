version: '3.8'

services:
  bybit-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bybit-hedge-bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../bybit_trades.csv:/app/bybit_trades.csv
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
